<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer subtle glowing border ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Zenith Concentric Focus Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="2" />

  <!-- Iconic Lightning Bolt / Z Glyph with Glow -->
  <path d="M 285 96 L 165 266 L 245 266 L 227 416 L 347 246 L 267 246 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)" />
</svg>
